packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact prerelease pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - alchemy@2.0.0-beta.79
  - xstate@6.0.0-alpha.59
  - "@xstate/effect@0.1.0-alpha.2"
  - "@distilled.cloud/aws@1.0.0-rc.12"
  - "@distilled.cloud/axiom@1.0.0-rc.12"
  - "@distilled.cloud/cloudflare@1.0.0-rc.12"
  - "@distilled.cloud/core@1.0.0-rc.12"
  - "@distilled.cloud/fly-io@1.0.0-rc.12"
  - "@distilled.cloud/hetzner@1.0.0-rc.12"
  - "@distilled.cloud/neon@1.0.0-rc.12"
  - "@distilled.cloud/planetscale@1.0.0-rc.12"
  - "@distilled.cloud/prisma@1.0.0-rc.12"
  - "@distilled.cloud/railway@1.0.0-rc.12"
  - "@distilled.cloud/stripe@1.0.0-rc.12"
  - "@earendil-works/chord@0.86.1"
  - "@earendil-works/pi-agent-core@0.86.1"
  - "@earendil-works/pi-ai@0.86.1"
  - "@earendil-works/pi-coding-agent@0.86.1"
  - "@earendil-works/pi-telemetry@0.86.1"
  - "@earendil-works/pi-tui@0.86.1"
  - satori@0.33.5
